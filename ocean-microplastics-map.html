<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Microplastic pollution of the world ocean</title>
  <style>
    :root {
      --bg: #05080e; --board: #0b1220; --ink: #e8eef8; --ink2: #b7c3d4;
      --blue: #2f7de1; --red: #d32f2f;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: var(--bg); color: var(--ink); font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    .stage { width: 100vw; height: 100vh; width: 100dvw; height: 100dvh; display: flex; align-items: center; justify-content: center; }
    .board {
      width: min(100vw, calc(100vh * 4 / 3));
      height: min(100vh, calc(100vw * 3 / 4));
      width: min(100dvw, calc(100dvh * 4 / 3));
      height: min(100dvh, calc(100dvw * 3 / 4));
      max-width: 100%; max-height: 100%;
      display: flex; flex-direction: column; background: var(--board);
      container-type: size;
    }
    .head { height: 8%; display: flex; align-items: center; justify-content: center; text-align: center; flex: 0 0 auto; padding: 0 4%; }
    .head .en { font-size: 3.2cqh; font-weight: 650; color: #b7c3d4; line-height: 1.15; }
    .head .src { font-size: 1.45cqh; font-weight: 400; color: #b7c3d4; line-height: 1.15; margin-top: 0.35cqh; }
    .mapbox { height: 75%; width: 90%; margin: 0 auto; position: relative; flex: 0 0 auto; background: #0b1220; }
    #map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .ui { position: absolute; top: calc(10px * var(--u, 1)); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 1.8cqh; z-index: 3; }
    .ui-btns { display: flex; gap: 1.8cqh; }
    button {
      appearance: none; border: 0; padding: 0.85cqh 1.5cqh; border-radius: 5px;
      cursor: pointer; min-width: 20cqh; color: #fff; text-align: center;
      transform: scale(1); opacity: 0.45; filter: saturate(0.7);
      transition: transform 0.2s ease, opacity 0.2s ease, filter 0.2s ease;
    }
    button:hover { transform: scale(1.05); opacity: 0.75; }
    button:active { transform: scale(0.9); }
    button.on {
      opacity: 1; filter: saturate(1); transform: scale(1.08);
      animation: btnPunch 0.5s ease;
    }
    button.on:hover { transform: scale(1.1); }
    button.on:active { transform: scale(0.94); }
    @keyframes btnPunch {
      0% { transform: scale(0.88); }
      40% { transform: scale(1.16); }
      100% { transform: scale(1.08); }
    }
    #btnWater { background: var(--blue); }
    #btnPollute { background: var(--red); }
    .bi .en { display: block; font-size: 1.55cqh; line-height: 1.1; color: #fff; }
    #yearNum { font-size: 3.2cqh; font-weight: 650; color: #b7c3d4; line-height: 1.15; transform: translateY(-30%); width: 100%; text-align: center; }
    #pauseIcon {
      position: absolute; left: 50%; bottom: calc(10px * var(--u, 1)); transform: translateX(-50%); z-index: 3;
      width: calc(0.85cqh * 2 + 1.55cqh * 1.1); height: calc(0.85cqh * 2 + 1.55cqh * 1.1);
      background: #b7c3d4; border-radius: 5px;
      display: flex; align-items: center; justify-content: center; gap: 8%;
      cursor: pointer;
    }
    #pauseIcon span { width: 22%; height: 52%; background: #3e4764; }
    #pauseIcon.paused { gap: 0; }
    #pauseIcon.paused span:last-child { display: none; }
    #pauseIcon.paused span:first-child {
      width: 0; height: 0; background: transparent;
      border-top: 0.9cqh solid transparent; border-bottom: 0.9cqh solid transparent;
      border-left: 1.45cqh solid #3e4764;
    }
    .legend { position: absolute; border: 0; background: transparent; z-index: 3; color: #e8eef8; padding: calc(3px * var(--u, 1)) calc(6px * var(--u, 1)) calc(3px * var(--u, 1)) 0; border-radius: 3px; pointer-events: none; line-height: 1.15; }
    .map-attr { position: absolute; z-index: 3; pointer-events: none; color: #b7c3d4; font-size: calc(10px * var(--u, 1)); line-height: 1.15; white-space: nowrap; text-align: right; }
    .map-attr div { text-align: right; }
    #tip {
      position: absolute; z-index: 4; display: none; pointer-events: none;
      background: #fff; color: #3e4764; border: 1px solid #3e4764;
      font-size: calc(12px * var(--u, 1)); line-height: 1.15;
      padding: calc(3px * var(--u, 1)) calc(6px * var(--u, 1));
      border-radius: 3px; white-space: nowrap;
    }
    #tip .val { font-weight: 700; }
    #map.paused { cursor: pointer; }
    .legend .cap { font-size: calc(12px * var(--u, 1)); margin-bottom: calc(1px * var(--u, 1)); line-height: 1.15; }
    .sw { display: flex; align-items: center; gap: calc(4px * var(--u, 1)); margin: 0; line-height: 1.15; }
    .sw .en { font-size: calc(12px * var(--u, 1)); color: #e8eef8; line-height: 1.15; }
    .dot { width: calc(6px * var(--u, 1)); height: calc(6px * var(--u, 1)); border-radius: 50%; flex: 0 0 auto; }
    .chartbox { height: 15%; width: 100%; flex: 0 0 auto; background: #0b1220; }
    #chart { display: block; width: 100%; height: 100%; }
  </style>
</head>

    const Z = 4, TN = 16;

    const mapCv = document.getElementById("map");
    const chartCv = document.getElementById("chart");
    const mctx = mapCv.getContext("2d");
    const cctx = chartCv.getContext("2d");
    const btnWater = document.getElementById("btnWater");
    const btnPollute = document.getElementById("btnPollute");
    const waterEn = document.getElementById("waterEn");
    const yearEl = document.getElementById("yearNum");
    const pauseIcon = document.getElementById("pauseIcon");
    const tip = document.getElementById("tip");
    const tipCoord = document.getElementById("tipCoord");
    const tipVal = document.getElementById("tipVal");

    let waterOnly = true, pollution = false, yearIndex = 0;
    // NOAA NCEI (Nyadjro 2023): ocean water is 1989–2022; 2023 has no ocean-water
    // samples (about 25 beach rows only, not packed into D). Axis 2008–2023 is the
    // display range. Do not copy 2022 points or yearly counts into 2023.
    const YEARS = [];
    for (let y = 2008; y <= 2023; y++) YEARS.push(y);
    let pointScale = 0.18;
    const YEAR_MS = 1100;
    let yearT0 = 0;
    let animStarted = false;
    let paused = false;
    let pausedElapsed = 0;
    const tiles = [];
    let hitPts = [];

    function tileUrl(kind, x, y) {
      if (kind === "google") return "https://mt" + ((x + y) % 4) + ".google.com/vt/lyrs=s&hl=en&x=" + x + "&y=" + y + "&z=" + Z;
      return "https://" + "abc".charAt((x + y) % 3) + ".basemaps.cartocdn.com/dark_all/" + Z + "/" + x + "/" + y + ".png";
    }
    function loadTiles() {
      for (let x = 0; x < TN; x++) {
        for (let y = 0; y < TN; y++) {
          const ya = y / TN, yb = (y + 1) / TN;
          if (yb < Y0 || ya > Y1) continue;
          const img = new Image();
          img.onload = function () { this.ready = true; this.done = true; drawMap(); maybeStart(); };
          img.onerror = function () {
            if (this.kind === "google") { this.kind = "carto"; this.src = tileUrl("carto", this.tx, this.ty); }
            else { this.done = true; maybeStart(); }
          };
          img.kind = "google"; img.tx = x; img.ty = y;
          img.src = tileUrl("google", x, y);
          tiles.push(img);
        }
      }
    }
    function mercator(lat, lon) {
      const x = (lon + 180) / 360;
      const s = Math.sin(lat * Math.PI / 180);
      const y = 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI);
      return [x, Math.min(0.999, Math.max(0.001, y))];
    }
    function pointsOfYear(y) {
      const rows = D.points[y] || [];
      return waterOnly ? rows.filter(function (p) { return p[2] === 1; }) : rows;
    }
    function fitCanvas(cv, ctx) {
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      const r = cv.getBoundingClientRect();
      cv.width = Math.max(1, Math.floor(r.width * dpr));
      cv.height = Math.max(1, Math.floor(r.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { w: r.width, h: r.height };
    }
    function mapFrame(w, h) {
      const span = Y1 - Y0;
      const scale = Math.min(w / 1, h / span);
      const mw = scale;
      const mh = scale * span;
      return { ox: (w - mw) / 2, oy: (h - mh) / 2, mw: mw, mh: mh, span: span };
    }
    function drawMap() {
      const S = fitCanvas(mapCv, mctx);
      mctx.fillStyle = "#0b1220";
      mctx.fillRect(0, 0, S.w, S.h);
      const F = mapFrame(S.w, S.h);
      const tw = F.mw / TN;
      for (let i = 0; i < tiles.length; i++) {
        const img = tiles[i];
        if (!img.ready) continue;
        const ya = img.ty / TN, yb = (img.ty + 1) / TN;
        mctx.drawImage(img, F.ox + img.tx * tw, F.oy + (ya - Y0) / F.span * F.mh, tw, (yb - ya) / F.span * F.mh);
      }
      mctx.fillStyle = "rgba(0,0,0,0.28)";
      mctx.fillRect(F.ox, F.oy, F.mw, F.mh);
      const pts = pointsOfYear(YEARS[yearIndex]);
      hitPts = [];
      for (let i = 0; i < pts.length; i++) {
        const p = pts[i];
        const m = mercator(p[0], p[1]);
        const x = F.ox + m[0] * F.mw;
        const yy = F.oy + (m[1] - Y0) / F.span * F.mh;
        if (yy < F.oy - 4 || yy > F.oy + F.mh + 4) continue;
        mctx.beginPath();
        mctx.globalAlpha = 0.92;
        let col, rad;
        if (pollution) {
          col = COLORS[p[3]] || COLORS[2];
          rad = 3.52 * pointScale;
        } else {
          col = SAMPLE;
          rad = 2.86 * pointScale;
        }
        mctx.fillStyle = col;
        mctx.arc(x, yy, rad, 0, Math.PI * 2);
        mctx.fill();
        hitPts.push({ x: x, y: yy, r: rad, p: p, color: col });
      }
      mctx.globalAlpha = 1;
      const u = boardU();
      const legend = document.getElementById("legend");
      legend.style.left = (F.ox + 8 * u) + "px";
      legend.style.top = "auto";
      legend.style.bottom = (S.h - F.oy - F.mh + 10 * u) + "px";
      const attr = document.getElementById("mapAttr");
      attr.style.left = "auto";
      attr.style.right = (S.w - F.ox - F.mw + 8 * u) + "px";
      attr.style.top = "auto";
      attr.style.bottom = (S.h - F.oy - F.mh + 10 * u) + "px";
    }
    function strokeSmooth(ctx, pts) {
      if (pts.length < 2) return;
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      if (pts.length === 2) {
        ctx.lineTo(pts[1][0], pts[1][1]);
        ctx.stroke();
        return;
      }
      for (let i = 0; i < pts.length - 1; i++) {
        const p0 = pts[Math.max(0, i - 1)];
        const p1 = pts[i];
        const p2 = pts[i + 1];
        const p3 = pts[Math.min(pts.length - 1, i + 2)];
        ctx.bezierCurveTo(
          p1[0] + (p2[0] - p0[0]) / 6,
          p1[1] + (p2[1] - p0[1]) / 6,
          p2[0] - (p3[0] - p1[0]) / 6,
          p2[1] - (p3[1] - p1[1]) / 6,
          p2[0], p2[1]
        );
      }
      ctx.stroke();
    }
    function boardU() {
      const b = document.querySelector(".board");
      const h = b ? b.clientHeight : 0;
      const w = b ? b.clientWidth : 0;
      const u = (w >= 700 || h >= 500 || !(h > 0)) ? 1 : h / 768;
      if (b) b.style.setProperty("--u", String(u));
      return u;
    }
    function lineLabel(ctx, en, x, y, color, align, px) {
      ctx.textAlign = align || "left";
      ctx.textBaseline = "middle";
      ctx.fillStyle = color;
      ctx.font = (px || 11) + "px Segoe UI, system-ui, sans-serif";
      ctx.fillText(en, x, y);
    }
    function drawChart() {
      const S = fitCanvas(chartCv, cctx);
      const u = boardU();
      cctx.fillStyle = "#0b1220";
      cctx.fillRect(0, 0, S.w, S.h);
      const mr = mapCv.getBoundingClientRect();
      const F = mapFrame(mr.width, mr.height);
      const left = (S.w - mr.width) / 2 + F.ox;
      const plotW = F.mw;
      const right = left + plotW;
      const top = 28 * u, bottom = 20 * u;
      const ph = Math.max(1, S.h - top - bottom);
      const font = function (px) { return (px * u) + "px Segoe UI, system-ui, sans-serif"; };
      const years = [], nY = [], cumP = [], cumN = [];
      let lastP = 0, lastN = 0;
      for (let y = 2008; y <= 2023; y++) {
        years.push(y);
        const idx = D.years.indexOf(y);
        if (idx >= 0) {
          nY.push(waterOnly ? D.nWater[idx] : D.nAll[idx]);
          lastP = waterOnly ? D.cumPWater[idx] : D.cumPAll[idx];
          lastN = waterOnly ? D.cumNWater[idx] : D.cumNAll[idx];
          cumP.push(lastP);
          cumN.push(lastN);
        } else {
          nY.push(0);
          cumP.push(lastP);
          cumN.push(lastN);
        }
      }
      const maxP = Math.max.apply(null, cumP) || 1;
      const maxN = Math.max.apply(null, cumN) || 1;
      const xAt = function (i) { return left + (years.length === 1 ? plotW / 2 : i * plotW / (years.length - 1)); };
      const yP = function (v) { return top + ph - (v / maxP) * ph; };
      const yN = function (v) { return top + ph - (v / maxN) * ph; };

      cctx.strokeStyle = "#2a3340";
      cctx.strokeRect(left, top, plotW, ph);

      cctx.textBaseline = "middle";
      cctx.font = font(13);
      cctx.fillStyle = INK;
      cctx.textAlign = "right";
      cctx.fillText("pieces/m³", left - 6 * u, 10 * u);
      cctx.textAlign = "left";
      cctx.fillText("samples", right + 6 * u, 10 * u);

      cctx.textBaseline = "middle";
      cctx.font = font(12);
      for (let t = 0; t <= 3; t++) {
        const y = yP(maxP * t / 3);
        cctx.strokeStyle = "#2a3340";
        cctx.beginPath();
        cctx.moveTo(left, y);
        cctx.lineTo(right, y);
        cctx.stroke();
        cctx.fillStyle = INK2;
        cctx.textAlign = "right";
        const pv = maxP * t / 3;
        cctx.fillText(Math.round(pv).toLocaleString("en-US"), left - 6 * u, y);
        cctx.textAlign = "left";
        const nv = maxN * t / 3;
        cctx.fillText(nv >= 1000 ? (nv / 1000).toFixed(1).replace(/\.0$/, "") + "k" : String(Math.round(nv)), right + 6 * u, yN(nv));
      }

      cctx.strokeStyle = RED;
      cctx.beginPath();
      cctx.moveTo(left, top);
      cctx.lineTo(left, top + ph);
      cctx.stroke();
      cctx.strokeStyle = BLUE;
      cctx.beginPath();
      cctx.moveTo(right, top);
      cctx.lineTo(right, top + ph);
      cctx.stroke();

      cctx.textAlign = "center";
      cctx.textBaseline = "alphabetic";
      cctx.font = font(13);
      for (let i = 0; i < years.length; i++) {
        const x = xAt(i);
        cctx.beginPath();
        cctx.strokeStyle = "#2a3340";
        cctx.moveTo(x, top + ph);
        cctx.lineTo(x, top + ph + 4 * u);
        cctx.stroke();
        cctx.fillStyle = INK2;
        cctx.fillText(String(years[i]), x, top + ph + 16 * u);
      }

      const ptsN = [], ptsP = [];
      for (let j = 0; j < years.length; j++) {
        ptsN.push([xAt(j), yN(cumN[j])]);
        ptsP.push([xAt(j), yP(cumP[j])]);
      }

      const i = years.indexOf(YEARS[yearIndex]);
      if (i >= 0) {
        cctx.save();
        cctx.beginPath();
        cctx.rect(left, top - 4 * u, Math.max(0, xAt(i) - left), ph + 8 * u);
        cctx.clip();
        cctx.lineWidth = Math.max(1, 2 * u);
        cctx.strokeStyle = BLUE;
        strokeSmooth(cctx, ptsN);
        cctx.strokeStyle = RED;
        strokeSmooth(cctx, ptsP);
        cctx.restore();
        cctx.lineWidth = 1;
      }

      lineLabel(cctx, "Cumulative pollution", left + 8 * u, 10 * u, RED, "left", 11 * u);
      lineLabel(cctx, "Cumulative measurements", right - 8 * u, 10 * u, BLUE, "right", 11 * u);

      if (i >= 0) {
        const cx = xAt(i);
        cctx.strokeStyle = "#e8eef8";
        cctx.lineWidth = Math.max(1, 2 * u);
        cctx.beginPath();
        cctx.moveTo(cx, top - 2 * u);
        cctx.lineTo(cx, top + ph + 6 * u);
        cctx.stroke();
        cctx.lineWidth = 1;
        cctx.font = font(13);
        cctx.fillStyle = INK;
        cctx.textBaseline = "alphabetic";
        cctx.textAlign = "right";
        cctx.fillText(String(years[i]), cx - 8 * u, top + 12 * u);
        cctx.textAlign = "left";
        const val = pollution ? cumP[i] : cumN[i];
        const num = pollution
          ? Math.round(val).toLocaleString("en-US")
          : (val >= 1000 ? (val / 1000).toFixed(1).replace(/\.0$/, "") + "k" : String(Math.round(val)));
        const tm = cctx.measureText(num);
        const padX = 7 * u, padY = 3 * u, rad = 5 * u;
        const asc = tm.actualBoundingBoxAscent || 10 * u;
        const desc = tm.actualBoundingBoxDescent || 3 * u;
        cctx.fillStyle = pollution ? RED : BLUE;
        cctx.beginPath();
        cctx.roundRect(cx + 8 * u - padX, top + 12 * u - asc - padY, tm.width + padX * 2, asc + desc + padY * 2, rad);
        cctx.fill();
        cctx.fillStyle = "#fff";
        cctx.fillText(num, cx + 8 * u, top + 12 * u);
        cctx.lineWidth = Math.max(1, 1.5 * u);
        cctx.strokeStyle = "#0b1220";
        cctx.fillStyle = pollution ? RED : BLUE;
        for (let j = 0; j <= i; j++) {
          cctx.beginPath();
          cctx.arc(xAt(j), pollution ? yP(cumP[j]) : yN(cumN[j]), 4.4 * u, 0, Math.PI * 2);
          cctx.fill();
          cctx.stroke();
        }
        cctx.lineWidth = 1;
      }
    }
    function draw() { drawMap(); drawChart(); yearEl.textContent = String(YEARS[yearIndex]); if (!paused) hideTip(); }
    btnWater.addEventListener("click", function () {
      pollution = false;
      waterOnly = true;
      btnWater.classList.add("on");
      btnPollute.classList.remove("on");
      waterEn.textContent = "Marine water samples";
      draw();
    });
    btnPollute.addEventListener("click", function () {
      pollution = !pollution;
      btnPollute.classList.toggle("on", pollution);
      btnWater.classList.toggle("on", !pollution);
      draw();
    });
    function relayout() { draw(); requestAnimationFrame(draw); }
    loadTiles();
    relayout();
    window.addEventListener("resize", relayout);
    window.addEventListener("orientationchange", relayout);
    if (window.visualViewport) window.visualViewport.addEventListener("resize", relayout);
    function tilesDone() {
      if (!tiles.length) return false;
      for (let i = 0; i < tiles.length; i++) if (!tiles[i].done) return false;
      return true;
    }
    function startAnim() {
      if (animStarted) return;
      animStarted = true;
      yearIndex = 0;
      yearT0 = performance.now();
      pointScale = pointScaleAt(0);
      draw();
      requestAnimationFrame(tick);
    }
    function maybeStart() {
      if (animStarted || startWait) return;
      if (!tilesDone()) return;
      startWait = setTimeout(startAnim, 400);
    }
    let startWait = 0;
    function pointScaleAt(u) {
      const s = u < 0.5 ? u * 2 : 2 - u * 2;
      const e = s * s * (3 - 2 * s);
      return 0.18 + 1.07 * e;
    }
    function tick(now) {
      if (paused) {
        requestAnimationFrame(tick);
        return;
      }
      let elapsed = now - yearT0;
      let yearChanged = false;
      while (elapsed >= YEAR_MS) {
        yearIndex = yearIndex + 1;
        if (yearIndex >= YEARS.length) {
          yearIndex = 0;
          if (pollution) btnWater.click();
          else btnPollute.click();
        }
        yearT0 += YEAR_MS;
        elapsed -= YEAR_MS;
        yearChanged = true;
      }
      pointScale = pointScaleAt(elapsed / YEAR_MS);
      drawMap();
      if (yearChanged) {
        yearEl.textContent = String(YEARS[yearIndex]);
        drawChart();
      }
      requestAnimationFrame(tick);
    }
    function hideTip() { tip.style.display = "none"; }
    function fmtMeas(v) {
      const n = Number(v);
      if (!isFinite(n)) return "—";
      if (Math.abs(n) >= 10) return Math.round(n).toLocaleString("en-US");
      return String(Number(n.toPrecision(3)));
    }
    function findHit(x, y) {
      let best = null, bestD = 1e9;
      for (let i = 0; i < hitPts.length; i++) {
        const h = hitPts[i];
        const dx = x - h.x, dy = y - h.y;
        const d = dx * dx + dy * dy;
        const lim = Math.max(h.r + 4, 8);
        if (d <= lim * lim && d < bestD) { bestD = d; best = h; }
      }
      return best;
    }
    function showTip(h) {
      const p = h.p;
      const lon = Number(p[1]).toFixed(3);
      const lat = Number(p[0]).toFixed(3);
      const unit = UNITS[p[5]] || UNITS[0];
      tipCoord.textContent = "Lat " + lat + ", Lon " + lon;
      tipVal.textContent = fmtMeas(p[4]) + " " + unit;
      tip.style.borderColor = h.color;
      tip.style.display = "block";
      const box = document.querySelector(".mapbox");
      const tw = tip.offsetWidth, th = tip.offsetHeight, bw = box.clientWidth, bh = box.clientHeight;
      let left = h.x + 8, top = h.y + 8;
      if (left + tw > bw - 4) left = h.x - tw - 8;
      if (top + th > bh - 4) top = h.y - th - 8;
      if (left < 4) left = 4;
      if (top < 4) top = 4;
      tip.style.left = left + "px";
      tip.style.top = top + "px";
    }
    function onMapPtr(e) {
      if (!paused) { hideTip(); return; }
      const r = mapCv.getBoundingClientRect();
      const h = findHit(e.clientX - r.left, e.clientY - r.top);
      if (h) showTip(h); else hideTip();
    }
    mapCv.addEventListener("mousemove", onMapPtr);
    mapCv.addEventListener("click", onMapPtr);
    mapCv.addEventListener("mouseleave", hideTip);

    pauseIcon.addEventListener("click", function () {
      paused = !paused;
      pauseIcon.classList.toggle("paused", paused);
      mapCv.classList.toggle("paused", paused);
      if (paused) {
        pausedElapsed = animStarted ? (performance.now() - yearT0) : 0;
      } else if (animStarted) {
        yearT0 = performance.now() - pausedElapsed;
        hideTip();
      } else {
        hideTip();
      }
    });
    setTimeout(startAnim, 8000);
    maybeStart();
  </script>
</body>
</html>
